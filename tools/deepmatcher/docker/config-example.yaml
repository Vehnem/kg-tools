process:
  cache: cacheddata.pth
  check_cached_data: true
  auto_rebuild_cache: true
  tokenize: nltk
  lowercase: true
  embeddings: glove.6B.50d
  embeddings_cache_path: ~/.vector_cache
  ignore_columns: []
  include_lengths: true
  id_attr: id
  label_attr: label
  left_prefix: left_
  right_prefix: right_
  use_magellan_convention: false
  pca: true

process_unlabeled:
  ignore_columns: null

model:
  attr_summarizer: hybrid
  attr_condense_factor: auto
  attr_comparator: null
  attr_merge: concat
  classifier: 2-layer-highway
  hidden_size: 300

train:
  epochs: 30
  criterion: null
  optimizer: null
  pos_neg_ratio: null
  pos_weight: null
  label_smoothing: 0.05
  save_every_prefix: null
  save_every_freq: 1
  batch_size: 32
  device: null
  progress_style: bar
  log_freq: 5
  sort_in_buckets: null

eval:
  batch_size: 32
  device: null
  progress_style: bar
  log_freq: 5
  sort_in_buckets: null

prediction:
  output_attributes: false
  batch_size: 32
  device: null
  progress_style: bar
  log_freq: 5
  sort_in_buckets: null

threshold:
  enabled: true
  mode: fixed
  value: 0.8
  fraction: 0.1
  std_multiplier: 1.0
  percentile: 90
  output_mode: filter

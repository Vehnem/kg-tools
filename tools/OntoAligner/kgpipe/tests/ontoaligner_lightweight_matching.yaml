task: ontoaligner_lightweight_matching
description: Tiny lightweight matching fixture for the pytest harness.
inputs:
  source: fixtures/memory-alpha-dump.xml
  target: fixtures/star-trek-expanded-universe-dump.xml
outputs:
  output: fixtures/expected.json
config:
  method: "lightweight"
  matcher: "simple_fuzzy"
  fuzzy_sm_threshold: 0.2
  encoder_name: "concept"
